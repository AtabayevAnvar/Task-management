# Render Blueprint — GitHub repo ulanganda yoki Blueprint deploy uchun
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: task-management
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString

databases:
  - name: taskflow-db
    plan: free
    databaseName: taskflow
    user: taskflow
